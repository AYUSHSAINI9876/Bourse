name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.compiler }} / ${{ matrix.build_type }}
    runs-on: ubuntu-latest
    # The C++ project lives in backend/; frontend/ is a static page with no
    # build of its own beyond the URL stamp that smoke-deploy.sh exercises.
    defaults:
      run:
        working-directory: backend
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, RelWithDebInfo]
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++

    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build libgtest-dev redis-tools ${{ matrix.compiler }}

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DBOURSE_BUILD_TESTS=ON \
            -DBOURSE_WERROR=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Unit and integration tests
        run: ctest --test-dir build --output-on-failure --parallel 2

      - name: Smoke — keyspace over redis-cli
        run: bash scripts/smoke-test.sh 6399

      - name: Smoke — HTTP and matching engine
        run: bash scripts/smoke-exchange.sh 6398 8099

      - name: Smoke — crash recovery
        run: bash scripts/smoke-persistence.sh 6397

      # Guards the split deployment: a dropped CORS header or a regression in
      # $PORT handling breaks the hosted demo while every other test stays green.
      # Also covers the auth flow over both protocols.
      - name: Smoke — split deployment and auth
        run: bash scripts/smoke-deploy.sh

      # The crypto is hand-written, so "matches the published vectors" is not
      # enough on its own -- this diffs it against Python's hashlib.
      - name: Crypto vs. Python hashlib
        run: bash scripts/verify-crypto.sh

      # The dashboard has no build step or type checker, so a typo in an
      # element id would fail silently in a browser and nowhere else.
      - name: Dashboard static checks
        run: bash scripts/check-dashboard.sh

  sanitizers:
    name: ${{ matrix.sanitizer }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address+undefined, thread]

    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build libgtest-dev

      - name: Build with ${{ matrix.sanitizer }}
        run: |
          cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBOURSE_SANITIZER=${{ matrix.sanitizer }} \
            -DBOURSE_BUILD_TESTS=ON
          cmake --build build --parallel

      - name: Run suite under ${{ matrix.sanitizer }}
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
          BOURSE_LOG_LEVEL: 'off'
        run: ./build/bin/bourse_tests

  static-analysis:
    name: format and tidy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      # clang-format comes from PyPI at an exact version, not from apt.
      #
      # Pinning the apt package to a major version is not enough: Ubuntu 24.04
      # ships 18.1.3 and 18.1.8 formats differently, so a tree formatted on one
      # fails the check on the other. The PyPI wheel is one specific LLVM
      # build, which makes CI and a contributor's machine run literally the
      # same binary. Reproduce locally with:
      #
      #   python3 -m venv ~/.cf && ~/.cf/bin/pip install clang-format==18.1.8
      #   ~/.cf/bin/clang-format -i <files>
      #
      # clang-tidy stays on apt: it reports warnings rather than gating on
      # them, so version drift there cannot redden the build.
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-tidy-18 cmake ninja-build libgtest-dev
          python3 -m venv "$HOME/.cf"
          "$HOME/.cf/bin/pip" install --quiet clang-format==18.1.8
          "$HOME/.cf/bin/clang-format" --version

      # Grouped with \( \) and NUL-separated: without the parentheses the -o
      # binds only the last -name, and without -print0 a path containing a
      # space is split into two arguments.
      - name: clang-format
        run: |
          find include src apps tests \( -name '*.hpp' -o -name '*.cpp' \) -print0 \
            | xargs -0 "$HOME/.cf/bin/clang-format" --dry-run --Werror

      # The dashboard is hex-encoded into a generated header at *build* time, so
      # configuring alone leaves bourse/dashboard_asset.hpp missing and
      # rest_api.cpp cannot be parsed at all. Building that one target is
      # enough, and far cheaper than building the project.
      - name: clang-tidy
        run: |
          cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBOURSE_BUILD_TESTS=OFF
          cmake --build build --target bourse_dashboard_asset
          find src apps -name '*.cpp' -print0 | xargs -0 clang-tidy-18 -p build --quiet

  docker:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -f backend/Dockerfile -t bourse:ci .
      - name: Smoke the image
        run: |
          docker run -d --name bourse-ci -p 6380:6380 bourse:ci
          sudo apt-get update && sudo apt-get install -y redis-tools
          for _ in $(seq 1 30); do
            if [ "$(redis-cli -p 6380 PING 2>/dev/null)" = "PONG" ]; then break; fi
            sleep 1
          done
          test "$(redis-cli -p 6380 PING)" = "PONG"
          redis-cli -p 6380 SET ci works
          test "$(redis-cli -p 6380 GET ci)" = "works"
          docker rm -f bourse-ci
