# Render blueprint -- the backend half of the deployment.
#
# This file has to sit at the repository root: Render only looks for
# render.yaml there, the same way GitHub only looks in .github/. Everything it
# points at lives under backend/.
#
# Vercel runs serverless functions with a request-scoped lifetime, so it cannot
# host this server: Bourse is a long-lived multi-threaded epoll reactor that
# holds TCP connections open and keeps the keyspace, order books and buffer
# pool in process memory. It needs a container. This is that container, built
# from the same Dockerfile used locally.
#
# Render reads this file automatically when you create a Blueprint from the
# repo, so none of the settings below have to be re-entered in the web UI.
services:
  - type: web
    name: bourse
    runtime: docker
    # No `repo:` on purpose -- omitting it means "the repository this blueprint
    # was created from", so nothing here has to be edited after forking.
    branch: main
    # Both paths are relative to the repository root. The context deliberately
    # spans both halves: the server embeds frontend/index.html, so a context of
    # backend/ alone would fail at the asset-embed step.
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    # Free instances are available in every Render region; Singapore is the
    # closest to India and knocks roughly 150 ms off each dashboard poll.
    region: singapore
    healthCheckPath: /health
    autoDeploy: true

    # Render injects $PORT and routes public traffic to it; Config::fromArgs
    # reads that before argv, which is why no port appears on this line. The
    # RESP listener still binds 6380 inside the container, but Render's free
    # web services publish exactly one HTTP port, so redis-cli cannot reach it
    # from outside. The REST API exposes the same commands over HTTP.
    #
    # 200mb against the free tier's 512 MB leaves headroom for the buffer pool
    # and per-connection buffers; allkeys-lru means a demo that gets hammered
    # sheds cold keys instead of being OOM-killed.
    dockerCommand: >-
      /usr/local/bin/bourse-server
      --host 0.0.0.0
      --maxmemory 200mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --dir /home/bourse/data
      --log-level info

    # Free instances have no persistent disk and are recycled when idle, so the
    # WAL and snapshots live in the container filesystem. Recovery is real and
    # works across a process restart; it does not survive the instance being
    # replaced. Attaching a disk mounted at /home/bourse/data on a paid plan
    # makes it durable, with no change to the command above.

    # Authentication, declared here rather than clicked into the dashboard.
    #
    # Without this block a Blueprint deploy comes up with auth *disabled* and
    # no demo account, which contradicts both the README and docs/security.md:
    # the front page publishes a read-only login and tells you to try it, and
    # on a fresh fork that login did not exist. Configuration that the
    # documentation depends on belongs in the repository, where forking it
    # reproduces the documented deployment with no manual steps.
    envVars:
      - key: BOURSE_AUTH
        # Quoted: unquoted yes is a YAML boolean, and the server wants a string.
        value: "yes"

      - key: BOURSE_ADMIN_USER
        value: admin

      # Generated by Render on first deploy and never written down here. A
      # committed admin password would be a published admin password, and the
      # generated value is visible in the dashboard if it is ever needed.
      - key: BOURSE_ADMIN_PASSWORD
        generateValue: true

      # The read-only account the README advertises. Safe to commit precisely
      # because it is a viewer: smoke-deploy.sh asserts role=viewer, a 200 on
      # read, and a 403 on both SET and FLUSHALL, so publishing this password
      # grants exactly the browsing the demo is meant to allow.
      - key: BOURSE_DEMO_USER
        value: guest
      - key: BOURSE_DEMO_PASSWORD
        value: explore-bourse-2026
