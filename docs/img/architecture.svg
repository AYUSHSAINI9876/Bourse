<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 660" width="940" height="660" role="img" aria-label="Bourse layered architecture diagram">
  <style>
    :root { color-scheme: light dark; }
    .bg    { fill: #ffffff; }
    .title { fill: #111827; font: 700 21px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .sub   { fill: #6b7280; font: 400 13px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .lname { fill: #111827; font: 600 14px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .ltag  { fill: #6b7280; font: 600 11px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .item  { fill: #374151; font: 400 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .muted { fill: #9ca3af; font: 400 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .card       { fill: #f9fafb; stroke: #d1d5db; stroke-width: 1.5; }
    .card-done  { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.5; }
    .card-plan  { fill: #f9fafb; stroke: #d1d5db; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .arrow { stroke: #9ca3af; stroke-width: 1.5; fill: none; }
    .badge-done { fill: #16a34a; }
    .badge-plan { fill: #9ca3af; }
    .badge-text { fill: #ffffff; font: 700 10px ui-sans-serif, -apple-system, "Segoe UI", sans-serif; }

    @media (prefers-color-scheme: dark) {
      .bg    { fill: #0d1117; }
      .title { fill: #e6edf3; }
      .sub   { fill: #8b949e; }
      .lname { fill: #e6edf3; }
      .ltag  { fill: #8b949e; }
      .item  { fill: #c9d1d9; }
      .muted { fill: #6e7681; }
      .card       { fill: #161b22; stroke: #30363d; }
      .card-done  { fill: #0f2417; stroke: #2ea043; }
      .card-plan  { fill: #161b22; stroke: #30363d; stroke-dasharray: 6 4; }
      .arrow { stroke: #6e7681; }
      .badge-done { fill: #2ea043; }
      .badge-plan { fill: #6e7681; }
      .badge-text { fill: #0d1117; }
    }
  </style>

  <rect class="bg" x="0" y="0" width="940" height="660"/>

  <text class="title" x="28" y="38">Bourse — layered architecture</text>
  <text class="sub"   x="28" y="60">One storage core, several execution frontends. Solid = shipped in v0.1, dashed = roadmap.</text>

  <!-- L6 dashboard -->
  <rect class="card-plan" x="28" y="82" width="884" height="52" rx="8"/>
  <text class="ltag"  x="46"  y="104">L6</text>
  <text class="lname" x="46"  y="122">dashboard/</text>
  <text class="muted" x="180" y="114">depth chart · trade tape · latency histogram · SQL console   (single self-contained HTML page)</text>
  <rect class="badge-plan" x="838" y="96" width="58" height="18" rx="9"/>
  <text class="badge-text" x="852" y="109">PLANNED</text>

  <path class="arrow" d="M470 134 L470 150" marker-end="url(#a)"/>

  <!-- L5 net -->
  <rect class="card-done" x="28" y="150" width="884" height="78" rx="8"/>
  <text class="ltag"  x="46"  y="172">L5</text>
  <text class="lname" x="46"  y="190">net/</text>
  <text class="item"  x="180" y="176">EventLoop (epoll reactor)  ·  Poller abstraction  ·  Connection  ·  acceptor + N I/O loops</text>
  <text class="item"  x="180" y="196">ProtocolCodec  →  RespCodec (RESP2, redis-cli compatible)</text>
  <text class="muted" x="180" y="216">ProtocolCodec  →  HttpCodec · WebSocketCodec · Router                              [planned]</text>
  <rect class="badge-done" x="846" y="164" width="50" height="18" rx="9"/>
  <text class="badge-text" x="857" y="177">SHIPPED</text>

  <path class="arrow" d="M470 228 L470 244" marker-end="url(#a)"/>

  <!-- L4 / L3b side by side -->
  <rect class="card-plan" x="28" y="244" width="430" height="88" rx="8"/>
  <text class="ltag"  x="46" y="266">L4</text>
  <text class="lname" x="46" y="284">match/</text>
  <text class="muted" x="46" y="306">OrderBook · price-time priority</text>
  <text class="muted" x="46" y="322">LIMIT/MARKET/IOC/FOK · SPSC ring</text>
  <rect class="badge-plan" x="384" y="258" width="58" height="18" rx="9"/>
  <text class="badge-text" x="398" y="271">PLANNED</text>

  <rect class="card-plan" x="482" y="244" width="430" height="88" rx="8"/>
  <text class="ltag"  x="500" y="266">L3b</text>
  <text class="lname" x="500" y="284">sql/</text>
  <text class="muted" x="500" y="306">Lexer → Parser → AST → Visitor</text>
  <text class="muted" x="500" y="322">volcano-model iterators</text>
  <rect class="badge-plan" x="838" y="258" width="58" height="18" rx="9"/>
  <text class="badge-text" x="852" y="271">PLANNED</text>

  <!-- L3a exec -->
  <rect class="card-done" x="28" y="348" width="884" height="72" rx="8"/>
  <text class="ltag"  x="46"  y="370">L3a</text>
  <text class="lname" x="46"  y="388">exec/</text>
  <text class="item"  x="180" y="374">Command (abstract) · CommandRegistry dispatch table · 46 verbs · central arity validation</text>
  <text class="item"  x="180" y="394">Reply (protocol-independent result) · PubSub fan-out by connection id</text>
  <text class="muted" x="180" y="412">strings · counters · TTL · lists · hashes · sets · pub/sub · introspection</text>
  <rect class="badge-done" x="846" y="362" width="50" height="18" rx="9"/>
  <text class="badge-text" x="857" y="375">SHIPPED</text>

  <path class="arrow" d="M470 420 L470 436" marker-end="url(#a)"/>

  <!-- L2 cache -->
  <rect class="card-done" x="28" y="436" width="884" height="72" rx="8"/>
  <text class="ltag"  x="46"  y="458">L2</text>
  <text class="lname" x="46"  y="476">cache/</text>
  <text class="item"  x="180" y="462">Keyspace: 16 shards · one mutex each · transparent hashing (no alloc per lookup)</text>
  <text class="item"  x="180" y="482">Value = variant&lt;string, int64, list, hash, set&gt; · lazy + active TTL expiry</text>
  <text class="item"  x="180" y="500">EvictionPolicy → LRU · LFU · Random · NoEviction   (sampled, not exact)</text>
  <rect class="badge-done" x="846" y="450" width="50" height="18" rx="9"/>
  <text class="badge-text" x="857" y="463">SHIPPED</text>

  <path class="arrow" d="M470 508 L470 524" marker-end="url(#a)"/>

  <!-- L1 storage -->
  <rect class="card-plan" x="28" y="524" width="884" height="52" rx="8"/>
  <text class="ltag"  x="46"  y="546">L1</text>
  <text class="lname" x="46"  y="564">storage/</text>
  <text class="muted" x="180" y="556">StorageEngine · Pager · BufferPool (LRU-K) · B+Tree · WAL + crash recovery · Snapshot</text>
  <rect class="badge-plan" x="838" y="538" width="58" height="18" rx="9"/>
  <text class="badge-text" x="852" y="551">PLANNED</text>

  <!-- L0 core -->
  <rect class="card-done" x="28" y="592" width="884" height="48" rx="8"/>
  <text class="ltag"  x="46"  y="612">L0</text>
  <text class="lname" x="46"  y="630">core/</text>
  <text class="item"  x="180" y="612">RAII File · RAII Socket · ByteBuffer · ThreadPool (bounded) · SpscRing (lock-free) · ObjectPool · Arena</text>
  <text class="item"  x="180" y="630">async Logger · Metrics (counters, gauges, HdrHistogram-style latency) · Status/Result</text>
  <rect class="badge-done" x="846" y="606" width="50" height="18" rx="9"/>
  <text class="badge-text" x="857" y="619">SHIPPED</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
  </defs>
</svg>
