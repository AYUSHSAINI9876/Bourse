<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 700" width="940" height="700" role="img" aria-label="Bourse layered architecture diagram">
  <style>
    :root { color-scheme: light dark; }
    .bg    { fill: #ffffff; }
    .title { fill: #111827; font: 700 21px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .sub   { fill: #6b7280; font: 400 13px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .lname { fill: #111827; font: 600 14px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .ltag  { fill: #6b7280; font: 600 11px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .item  { fill: #374151; font: 400 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .muted { fill: #9ca3af; font: 400 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .card-done  { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.5; }
    .card-plan  { fill: #f9fafb; stroke: #d1d5db; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .arrow { stroke: #9ca3af; stroke-width: 1.5; fill: none; }
    .badge-done { fill: #16a34a; }
    .badge-plan { fill: #9ca3af; }
    .badge-text { fill: #ffffff; font: 700 10px ui-sans-serif, -apple-system, "Segoe UI", sans-serif; }

    @media (prefers-color-scheme: dark) {
      .bg    { fill: #0d1117; }
      .title { fill: #e6edf3; }
      .sub   { fill: #8b949e; }
      .lname { fill: #e6edf3; }
      .ltag  { fill: #8b949e; }
      .item  { fill: #c9d1d9; }
      .muted { fill: #6e7681; }
      .card-done  { fill: #0f2417; stroke: #2ea043; }
      .card-plan  { fill: #161b22; stroke: #30363d; stroke-dasharray: 6 4; }
      .arrow { stroke: #6e7681; }
      .badge-done { fill: #2ea043; }
      .badge-plan { fill: #6e7681; }
      .badge-text { fill: #0d1117; }
    }
  </style>

  <rect class="bg" x="0" y="0" width="940" height="700"/>

  <text class="title" x="28" y="38">Bourse — layered architecture</text>
  <text class="sub"   x="28" y="60">One command registry, three transports, one storage core. Solid = built and tested, dashed = roadmap.</text>

  <!-- L6 dashboard -->
  <rect class="card-done" x="28" y="82" width="884" height="56" rx="8"/>
  <text class="ltag"  x="46"  y="104">L6</text>
  <text class="lname" x="46"  y="122">dashboard/</text>
  <text class="item"  x="180" y="108">depth ladder · trade tape · latency histogram · command console · keyspace browser</text>
  <text class="muted" x="180" y="126">single self-contained HTML page, compiled into the binary — no CDN, no build step</text>
  <rect class="badge-done" x="846" y="100" width="50" height="18" rx="9"/>
  <text class="badge-text" x="857" y="113">SHIPPED</text>

  <path class="arrow" d="M470 138 L470 154" marker-end="url(#a)"/>

  <!-- L5 net -->
  <rect class="card-done" x="28" y="154" width="884" height="94" rx="8"/>
  <text class="ltag"  x="46"  y="176">L5</text>
  <text class="lname" x="46"  y="194">net/</text>
  <text class="item"  x="180" y="176">EventLoop (epoll reactor) · Poller abstraction · acceptor + N I/O loops · Connection</text>
  <text class="item"  x="180" y="196">ProtocolCodec → RespCodec (RESP2, redis-cli compatible)</text>
  <text class="item"  x="180" y="216">ProtocolCodec → HttpCodec (keep-alive) · Router with :params · middleware chain</text>
  <text class="muted" x="180" y="236">WebSocketCodec for streaming market data                                        [planned]</text>
  <rect class="badge-done" x="846" y="168" width="50" height="18" rx="9"/>
  <text class="badge-text" x="857" y="181">SHIPPED</text>

  <path class="arrow" d="M470 248 L470 264" marker-end="url(#a)"/>

  <!-- L4 / L3b side by side -->
  <rect class="card-done" x="28" y="264" width="430" height="96" rx="8"/>
  <text class="ltag"  x="46" y="286">L4</text>
  <text class="lname" x="46" y="304">match/</text>
  <text class="item"  x="46" y="326">OrderBook · price-time priority</text>
  <text class="item"  x="46" y="344">LIMIT/MARKET/IOC/FOK · integer ticks</text>
  <text class="muted" x="46" y="356">intrusive FIFO levels · ObjectPool hot path</text>
  <rect class="badge-done" x="392" y="278" width="50" height="18" rx="9"/>
  <text class="badge-text" x="403" y="291">SHIPPED</text>

  <rect class="card-done" x="482" y="264" width="430" height="96" rx="8"/>
  <text class="ltag"  x="500" y="286">L3b</text>
  <text class="lname" x="500" y="304">sql/</text>
  <text class="item"  x="500" y="326">Lexer → Parser → AST → Visitor</text>
  <text class="item"  x="500" y="344">volcano iterators: Scan/Filter/Sort/Limit</text>
  <text class="muted" x="500" y="356">CREATE · INSERT · SELECT · UPDATE · DELETE</text>
  <rect class="badge-done" x="846" y="278" width="50" height="18" rx="9"/>
  <text class="badge-text" x="857" y="291">SHIPPED</text>

  <!-- L3a exec -->
  <rect class="card-done" x="28" y="376" width="884" height="76" rx="8"/>
  <text class="ltag"  x="46"  y="398">L3a</text>
  <text class="lname" x="46"  y="416">exec/</text>
  <text class="item"  x="180" y="400">Command (abstract) · CommandRegistry dispatch table · 57 verbs · central arity check</text>
  <text class="item"  x="180" y="420">Reply (protocol-independent) · PubSub fan-out by id · single journal hook for the WAL</text>
  <text class="muted" x="180" y="440">strings · counters · TTL · lists · hashes · sets · pub/sub · exchange · SQL · introspection</text>
  <rect class="badge-done" x="846" y="390" width="50" height="18" rx="9"/>
  <text class="badge-text" x="857" y="403">SHIPPED</text>

  <path class="arrow" d="M470 452 L470 468" marker-end="url(#a)"/>

  <!-- L2 cache -->
  <rect class="card-done" x="28" y="468" width="884" height="74" rx="8"/>
  <text class="ltag"  x="46"  y="490">L2</text>
  <text class="lname" x="46"  y="508">cache/</text>
  <text class="item"  x="180" y="494">Keyspace: 16 shards · one mutex each · transparent hashing (no alloc per lookup)</text>
  <text class="item"  x="180" y="514">Value = variant&lt;string, int64, list, hash, set&gt; · lazy + active TTL expiry</text>
  <text class="item"  x="180" y="532">EvictionPolicy → LRU · LFU · Random · NoEviction   (sampled, not exact)</text>
  <rect class="badge-done" x="846" y="482" width="50" height="18" rx="9"/>
  <text class="badge-text" x="857" y="495">SHIPPED</text>

  <path class="arrow" d="M470 542 L470 558" marker-end="url(#a)"/>

  <!-- L1 storage -->
  <rect class="card-done" x="28" y="558" width="884" height="72" rx="8"/>
  <text class="ltag"  x="46"  y="580">L1</text>
  <text class="lname" x="46"  y="598">storage/</text>
  <text class="item"  x="180" y="582">WriteAheadLog: CRC-32 framed records · torn-tail truncation · 3 fsync policies</text>
  <text class="item"  x="180" y="602">Snapshot: atomic write-rename · checksummed · TTL-aware restore</text>
  <text class="item"  x="180" y="620">DiskManager (4 KiB pages, free list) · BufferPool (pinning, LRU, write-back) · B+Tree</text>
  <rect class="badge-done" x="846" y="572" width="50" height="18" rx="9"/>
  <text class="badge-text" x="857" y="585">SHIPPED</text>

  <!-- L0 core -->
  <rect class="card-done" x="28" y="646" width="884" height="48" rx="8"/>
  <text class="ltag"  x="46"  y="666">L0</text>
  <text class="lname" x="46"  y="684">core/</text>
  <text class="item"  x="180" y="666">RAII File · RAII Socket · ByteBuffer · ThreadPool (bounded) · SpscRing (lock-free) · ObjectPool · Arena</text>
  <text class="item"  x="180" y="684">async Logger · Metrics (counters, gauges, HdrHistogram-style latency) · Status/Result</text>
  <rect class="badge-done" x="846" y="660" width="50" height="18" rx="9"/>
  <text class="badge-text" x="857" y="673">SHIPPED</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
  </defs>
</svg>
